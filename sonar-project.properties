# SonarCloud analysis settings. Confirm the key and organisation under
# SonarCloud > Project > Information if the project was imported differently.
sonar.projectKey=spchandera_smilie-sonarqube-28sep
sonar.organization=spchandera
sonar.projectName=smilie-sonarqube-28sep

# Baseline for the "new code" period (Previous version). Bump this on each
# release so the quality gate measures only changes made since that release.
sonar.projectVersion=1.0.0

# Theme source folders (Shopify only deploys these)
sonar.sources=assets,blocks,config,layout,locales,sections,snippets,templates
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Unit test coverage produced by `npm run test:coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info
